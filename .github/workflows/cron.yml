name: EDGAR Ingestion Pipeline

on:
  schedule:
    - cron: '0 11 * * *'
    - cron: '30 14 * * *'
    - cron: '0 16 * * *'
    - cron: '0 10 * * 0'
  workflow_dispatch:

jobs:
  execute:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 14 * * *'
    steps:
      - name: Execute trades
        run: |
          curl -f -X POST "${{ secrets.VERCEL_URL }}/api/trading/execute" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  monitor:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 16 * * *'
    steps:
      - name: Monitor positions
        run: |
          curl -f -X GET "${{ secrets.VERCEL_URL }}/api/trading/monitor" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  ingest:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 11 * * *'
    runs-on: ubuntu-latest

    steps:
      - name: Batch 0
        run: |
          curl -f -X GET "${{ secrets.VERCEL_URL }}/api/insider/ingest?batch=0" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Wait 5 minutes
        run: sleep 300

      - name: Batch 1
        run: |
          curl -f -X GET "${{ secrets.VERCEL_URL }}/api/insider/ingest?batch=1" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Wait 5 minutes
        run: sleep 300

      - name: Batch 2
        run: |
          curl -f -X GET "${{ secrets.VERCEL_URL }}/api/insider/ingest?batch=2" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Wait 5 minutes
        run: sleep 300

      - name: Batch 3 + Price Enrich
        run: |
          curl -f -X GET "${{ secrets.VERCEL_URL }}/api/insider/ingest?batch=3" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" &
          curl -f -X GET "${{ secrets.VERCEL_URL }}/api/insider/price-enrich" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" &
          wait

      - name: Wait 5 minutes
        run: sleep 300

      - name: Score
        run: |
          curl -f -X GET "${{ secrets.VERCEL_URL }}/api/insider/score" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  cleanup-news:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 * * 0'
    steps:
      - name: Delete old news events
        run: |
          curl -f -X GET "${{ secrets.VERCEL_URL }}/api/maintenance/cleanup-news" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
