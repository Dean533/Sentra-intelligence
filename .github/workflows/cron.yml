name: EDGAR Ingestion Pipeline

on:
  schedule:
    - cron: '0 11 * * *'
    - cron: '30 14 * * *'
    - cron: '0 16 * * *'
    - cron: '0 10 * * 0'
  workflow_dispatch:

jobs:
  execute:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 14 * * *'
    steps:
      - name: Execute trades
        run: |
          curl -f -X POST "${{ secrets.VERCEL_URL }}/api/trading/execute" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  monitor:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 16 * * *'
    steps:
      - name: Monitor positions
        run: |
          curl -f -X GET "${{ secrets.VERCEL_URL }}/api/trading/monitor" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  ingest:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 11 * * *'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run daily ingest
        run: npx tsx scripts/run-daily-ingest.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PRIVATE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Price enrich
        run: |
          curl -f -X GET "${{ secrets.VERCEL_URL }}/api/insider/price-enrich" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Score
        run: |
          curl -f -X GET "${{ secrets.VERCEL_URL }}/api/insider/score" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  cleanup-news:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 * * 0'
    steps:
      - name: Delete old news events
        run: |
          curl -f -X GET "${{ secrets.VERCEL_URL }}/api/maintenance/cleanup-news" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
