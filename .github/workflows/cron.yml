name: EDGAR Ingestion Pipeline

on:
  schedule:
    - cron: '0 11 * * *'
    # Schedules for the disabled Alpaca jobs (execute, monitor). Commented out so
    # the workflow does not spin up empty runs at these times. Uncomment together
    # with the matching job's original `if:` below to re-enable.
    # - cron: '30 14 * * *'
    # - cron: '0 16 * * *'
    - cron: '0 10 * * 0'
  workflow_dispatch:

jobs:
  # Disabled 2026-11-09 so no trades fire on stale logic when the workflow is
  # re-enabled after GitHub's inactivity shutoff. `if: false` also blocks manual
  # workflow_dispatch runs from triggering it. To re-enable, restore the
  # commented-out `if:` and uncomment its schedule above.
  execute:
    runs-on: ubuntu-latest
    if: ${{ false }}
    # if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 14 * * *'
    steps:
      - name: Execute trades
        run: |
          curl -f -X POST "${{ secrets.VERCEL_URL }}/api/trading/execute" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  # Disabled 2026-11-09, same reason and same re-enable steps as `execute`.
  monitor:
    runs-on: ubuntu-latest
    if: ${{ false }}
    # if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 16 * * *'
    steps:
      - name: Monitor positions
        run: |
          curl -f -X GET "${{ secrets.VERCEL_URL }}/api/trading/monitor" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  ingest:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 11 * * *'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run daily ingest
        run: npx tsx scripts/run-daily-ingest.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PRIVATE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.NEXT_PRIVATE_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Price enrich
        run: |
          curl -f -X GET "${{ secrets.VERCEL_URL }}/api/insider/price-enrich" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Score
        run: |
          curl -f -X GET "${{ secrets.VERCEL_URL }}/api/insider/score" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Conviction score
        run: |
          curl -f -X GET "${{ secrets.VERCEL_URL }}/api/insider/conviction-score" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

  cleanup-news:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 * * 0'
    steps:
      - name: Delete old news events
        run: |
          curl -f -X GET "${{ secrets.VERCEL_URL }}/api/maintenance/cleanup-news" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
